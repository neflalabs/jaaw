name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'bin/jaaw'
      - 'install.sh'
      - 'uninstall.sh'
      - 'completions/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Auto Release (CalVer)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Next CalVer Tag
        id: versioning
        run: |
          DATE_TAG="v$(date -u +'%Y.%m.%d')"
          
          # Fetch all tags from remote
          git fetch --tags --force
          
          # Check if tag for today already exists
          if git rev-parse "$DATE_TAG" >/dev/null 2>&1; then
            COUNT=1
            while git rev-parse "${DATE_TAG}.${COUNT}" >/dev/null 2>&1; do
              COUNT=$((COUNT + 1))
            done
            FINAL_TAG="${DATE_TAG}.${COUNT}"
          else
            FINAL_TAG="$DATE_TAG"
          fi
          
          echo "tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "Calculated new version tag: $FINAL_TAG"

      - name: Update VERSION in bin/jaaw
        run: |
          NEW_VERSION="${{ steps.versioning.outputs.tag }}"
          sed -i 's/^VERSION=".*"/VERSION="'"$NEW_VERSION"'"/' bin/jaaw

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/jaaw
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump version to ${{ steps.versioning.outputs.tag }} [skip ci]"
            git push origin main
          fi

      - name: Create Git Tag & GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "Release ${{ steps.versioning.outputs.tag }}"
          generate_release_notes: true
          files: |
            bin/jaaw
            install.sh
            uninstall.sh
            completions/jaaw.bash
            completions/_jaaw
            completions/jaaw.fish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
